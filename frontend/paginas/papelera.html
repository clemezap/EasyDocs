<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papelera · EasyDocs</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <div class="app" data-pagina="papelera" hidden>
        <aside class="barra-lateral" id="barra-lateral"></aside>

        <main class="contenido">
            <header class="contenido-encabezado">
                <h1>Papelera</h1>
            </header>

            <section class="lista">
                <div class="fila fila-encabezado">
                    <input type="checkbox" id="seleccionar-todo" aria-label="Seleccionar todo">
                    <span>Nombre</span>
                    <span class="col-extra">Eliminado</span>
                    <span class="col-extra">Tamaño</span>
                </div>

                <ul class="lista-elementos" id="lista-elementos"></ul>

                <p class="lista-vacia" id="lista-vacia">La papelera está vacía.</p>
            </section>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
</body>
</html>
